<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101112" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Dirty Octopus 独立音频插件商店。Spectral Corruptor，探索频域里的声音。微信付款，人工核验与激活。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' __API_CONNECT_SRC__; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>联系方式 / Dirty Octopus</title>
    <link rel="icon" href="/assets/dirty-octopus.svg" type="image/svg+xml" />
    <script type="module" blocking="render" src="/src/contact.ts"></script>
  </head>
  <body data-treatment="halftone">
    <a class="skip" href="#main">跳到主要内容</a>
    <div class="shell">
      <header class="masthead">
        <a class="brand" href="/" aria-label="Dirty Octopus 商店首页"
          ><img
            src="/assets/dirty-octopus.svg"
            alt=""
            width="70"
            height="52"
          /><span
            >DIRTY OCTOPUS<small>独立音频插件 / AUDIO TOOLS</small></span
          ></a
        >
        <nav aria-label="主导航">
          <a class="nav active" href="/" aria-current="page"
            >插件商店<span>SHOP</span></a
          ><a class="nav" href="#recent">本设备订单<span>MY ORDERS</span></a
          ><a class="nav" href="https://dirtyoctopus.net"
            >作品集 ↗<span>PORTFOLIO</span></a
          >
        </nav>
      </header>
      <main id="main">
        <section class="contact-section" aria-labelledby="contact-title">
          <div>
            <h2 id="contact-title">有问题，直接联系我。</h2>
            <p class="muted">
              购买前可确认插件兼容性；付款后请带上商店订单号。
            </p>
          </div>
          <dl class="contacts">
            <div>
              <dt>QQ</dt>
              <dd data-contact="qq">REPLACE_ME</dd>
            </div>
            <div>
              <dt>微信</dt>
              <dd data-contact="wechat">REPLACE_ME</dd>
            </div>
          </dl>
        </section>
        <section
          class="community-panel panel"
          data-community
          hidden
          aria-labelledby="community-title"
        >
          <div>
            <p class="eyebrow">COMMUNITY / QQ GROUP</p>
            <h2 id="community-title">一起讨论插件。</h2>
            <p>
              欢迎加入 Dirty Octopus
              粉丝／亲友群，交流插件使用、声音设计与作品。
            </p>
            <p class="muted small">
              在 QQ 中搜索群号申请加入。付款核验资料请通过上方
              QQ／微信私聊发送。
            </p>
          </div>
          <div>
            <strong data-contact="qqGroup" id="qq-group"></strong
            ><button id="copy-group" class="button">复制群号</button>
          </div>
        </section>
      </main>
      <footer>
        <span>DIRTY OCTOPUS / AUDIO TOOLS</span><a href="/admin/">订单管理 ↗</a>
      </footer>
    </div>
    <noscript
      ><p class="notice">购买与查看订单需要启用 JavaScript。</p></noscript
    >
  </body>
</html>
